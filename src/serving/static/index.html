<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レシート情報抽出 AI (Qwen2-VL LoRA)</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* アップロードエリア */
    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      background: #f1f5f9;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .drop-zone p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .file-input {
      display: none;
    }

    /* プレビュー画像 */
    .preview-container {
      margin-top: 1rem;
      text-align: center;
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 6px;
      border: 1px solid var(--border);
      object-fit: contain;
    }

    /* ボタン */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 1rem;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* 結果エリア */
    .result-section {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .result-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .badge {
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      background-color: #e2e8f0;
      color: var(--text-muted);
    }

    .badge.success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
    }

    .info-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .info-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .raw-json {
      background: #0f172a;
      color: #38bdf8;
      padding: 1rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      max-height: 180px;
      margin-top: auto;
    }

    /* スピナー */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      font-size: 0.95rem;
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧾 レシート情報抽出 AI サービス</h1>
      <p>Qwen2-VL-2B (LoRAファインチューニング済) による構造化データ抽出</p>
    </header>

    <div class="card">
      <div class="grid">
        <!-- アップロード側 -->
        <div>
          <div class="drop-zone" id="dropZone">
            <svg width="40" height="40" fill="none" stroke="#94a3b8" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p><strong>クリックして画像を選択</strong> またはドラッグ＆ドロップ</p>
            <p style="font-size: 0.8rem; color: #94a3b8;">PNG, JPG, JPEG に対応</p>
            <input type="file" id="fileInput" class="file-input" accept="image/*">
          </div>

          <div class="preview-container" id="previewContainer">
            <img id="previewImg" class="preview-img" alt="プレビュー">
          </div>

          <button id="submitBtn" class="btn" disabled>情報を抽出する</button>
        </div>

        <!-- 抽出結果側 -->
        <div class="result-section">
          <div class="result-header">
            <h2>抽出結果</h2>
            <span id="latencyBadge" class="badge">待機中</span>
          </div>

          <div id="resultContent" style="display: none; flex-direction: column; flex-grow: 1;">
            <div class="info-list">
              <div class="info-item">
                <span class="info-label">店舗名 (store_name)</span>
                <span class="info-value" id="resStore">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">日時 (datetime)</span>
                <span class="info-value" id="resDatetime">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">合計金額 (total)</span>
                <span class="info-value" id="resTotal" style="color: #dc2626;">-</span>
              </div>
            </div>

            <div style="margin-top: 0.5rem; margin-bottom: 0.3rem;">
              <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">RAW JSON</span>
            </div>
            <pre class="raw-json" id="rawJson"></pre>
          </div>

          <div id="emptyState" class="empty-state">
            左側でレシート画像をアップロードしてください
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    
    const latencyBadge = document.getElementById('latencyBadge');
    const emptyState = document.getElementById('emptyState');
    const resultContent = document.getElementById('resultContent');
    
    const resStore = document.getElementById('resStore');
    const resDatetime = document.getElementById('resDatetime');
    const resTotal = document.getElementById('resTotal');
    const rawJson = document.getElementById('rawJson');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('画像ファイルを選択してください。');
        return;
      }
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        previewContainer.style.display = 'block';
        submitBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    submitBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> AIが抽出中...';
      latencyBadge.textContent = '推論中...';
      latencyBadge.className = 'badge';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const response = await fetch('/api/extract', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error(`サーバーエラー: ${response.status}`);
        }

        const data = await response.json();
        const res = data.result || {};

        resStore.textContent = res.store_name || '(未検出)';
        resDatetime.textContent = res.datetime || '(未検出)';
        resTotal.textContent = res.total || '(未検出)';

        rawJson.textContent = JSON.stringify(res, null, 2);

        emptyState.style.display = 'none';
        resultContent.style.display = 'flex';

        latencyBadge.textContent = `⏱️ ${data.latency_sec} 秒`;
        latencyBadge.className = 'badge success';

      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
        latencyBadge.textContent = 'エラー';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '情報を抽出する';
      }
    });
  </script>
</body>
</html>
